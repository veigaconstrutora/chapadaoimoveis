# Gera /imovel/<código>/ (página de cada imóvel), /og/<código>.jpg e o sitemap.xml
# sempre que o painel salvar imóveis ou fotos.
name: Páginas dos imóveis
on:
  push:
    branches: [main]
    paths: ["dados/**", "fotos/**", "scripts/gerar-paginas.py"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: paginas-imoveis
  cancel-in-progress: false
jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Gerar páginas
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick
          python3 scripts/gerar-paginas.py
      - name: Salvar
        run: |
          git config user.name "gerador-de-paginas"
          git config user.email "actions@users.noreply.github.com"
          git add imovel og sitemap.xml
          git diff --cached --quiet && exit 0
          git commit -m "Atualiza páginas dos imóveis"
          for i in 1 2 3; do git pull --rebase -q && git push && exit 0; sleep 5; done
          exit 1
